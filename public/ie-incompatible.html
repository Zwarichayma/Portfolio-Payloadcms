<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Navigateur non compatible</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #fbfaff;
        color: #2a2140;
      }
      main {
        max-width: 32rem;
        text-align: center;
      }
      h1 {
        font-size: 1.75rem;
        margin: 0 0 0.75rem;
      }
      p {
        color: #8a7bb0;
        line-height: 1.6;
        margin: 0 0 1.5rem;
      }
      a {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        background: linear-gradient(135deg, #7c3aed, #6d28d9);
        color: #fff;
        text-decoration: none;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Navigateur non compatible</h1>
      <p>
        Votre navigateur n'est pas pris en charge. Merci d'utiliser une version récente de Chrome,
        Firefox, Safari ou Edge pour consulter ce site.
      </p>
      <a href="https://browsehappy.com/" target="_blank" rel="noopener noreferrer">
        Mettre à jour mon navigateur
      </a>
    </main>
  </body>
</html>
